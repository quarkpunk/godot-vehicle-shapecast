name: Build VehicleShapecast
on: workflow_dispatch

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            { platform: linux, arch: x86_64, os: ubuntu-22.04 },
            { platform: windows, arch: x86_64, os: windows-latest },
            { platform: macos, arch: universal, os: macos-latest },
          ]
        target-type: [template_debug, template_release]

    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}
          windows-compiler: ${{ matrix.target.platform == 'windows' && 'msvc' || 'mingw' }}

      - name: Restore .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.target-type }}

      - name: Build GDExtension
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          if [ "${{ matrix.target.platform }}" = "windows" ]; then
            scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} api_version=4.7 use_mingw=no
          else
            scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} api_version=4.7
          fi

      - name: Save .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.target-type }}

      - name: Windows - Delete compilation files
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        run: |
          Remove-Item project/addons/vehicle_shapecast/bin/* -Include *.exp,*.lib,*.pdb -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vehicle_shapecast-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}
          path: |
            ${{ github.workspace }}/project/addons/vehicle_shapecast/bin/**

  merge-builds:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Merge binaries Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: vehicle_shapecast-binaries
          pattern: vehicle_shapecast-*
          delete-merged: true

  merge-addon:
    runs-on: ubuntu-22.04
    needs: merge-builds
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: vehicle_shapecast-binaries
          path: project/addons/vehicle_shapecast/bin/

      - name: Prepare release folder
        shell: bash
        run: |
          mkdir -p release/addons
          cp -r project/addons/vehicle_shapecast release/addons/

      - name: Create ZIP
        shell: bash
        run: |
          cd release
          zip -r ../vehicle_shapecast.zip addons/

      - name: Upload addon folder
        uses: actions/upload-artifact@v4
        with:
          name: vehicle_shapecast-addon
          path: vehicle_shapecast.zip

      - name: Remove binaries artifact
        uses: geekyeggo/delete-artifact@v5
        with:
            name: vehicle_shapecast-binaries